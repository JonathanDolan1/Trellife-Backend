# Render Blueprint for Trellife: one free web service.
# Express serves the API (/api), socket.io, and the prebuilt React app in public/.
# Secret values are never stored here. MONGO_URL is pasted in the Render
# dashboard; SECRET1 is generated by Render.
services:
  - type: web
    name: trellife
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MONGO_URL
        sync: false
      - key: SECRET1
        generateValue: true
